<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alaa Elhaj – Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14365c; --navy-deep:#0d2540; --sky:#4f9fe0; --sun:#f0b84a;
  --bg:#f4f6f9; --card:#ffffff; --text:#1b2a3b; --muted:#5b6b7e; --line:#dbe2ea;
  --side-text:#e9f0f8; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1b2a;--card:#162538;--text:#e6edf5;--muted:#9fb0c3;--line:#26384d;--navy-deep:#091524;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f1b2a;--card:#162538;--text:#e6edf5;--muted:#9fb0c3;--line:#26384d;--navy-deep:#091524;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.65 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,sans-serif;line-height:1.15;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--navy);color:var(--side-text);padding:2.5rem 1.75rem;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.avatar{width:150px;height:150px;border-radius:50%;background:var(--navy-deep);border:4px solid var(--sky);display:grid;place-items:center;font:800 3rem 'Bricolage Grotesque',sans-serif;margin:0 auto 1.5rem;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
aside h2{font-size:1.05rem;margin:1.75rem 0 .75rem;color:var(--sun)}
aside ul{list-style:none;padding:0;margin:0;font-size:.95rem}
aside li{margin:.45rem 0;word-break:break-word}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:.25rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky);border-radius:3px}
main{padding:3.5rem clamp(1.25rem,5vw,4.5rem);max-width:960px}
.hero h1{font-size:clamp(2.6rem,7vw,4.8rem);font-weight:800;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h1{color:#fff}}
:root[data-theme="dark"] .hero h1{color:#fff}
.hero .role{font-size:1.3rem;color:var(--muted);margin:.5rem 0 1.25rem;font-weight:500}
.hero p{max-width:62ch;font-size:1.1rem}
.cta{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
.btn{display:inline-block;padding:.7rem 1.3rem;border-radius:8px;font-weight:600;text-decoration:none;border:2px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;font:inherit;font-weight:600}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn:hover{border-color:var(--sky)}
section{margin-top:4rem}
section>h2{font-size:1.9rem;color:var(--navy);padding-bottom:.6rem;border-bottom:3px solid var(--sky);display:inline-block;margin-bottom:1.5rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) section>h2{color:#fff}}
:root[data-theme="dark"] section>h2{color:#fff}
.tl{border-left:3px solid var(--line);padding-left:1.5rem;margin-left:.4rem}
.item{position:relative;margin-bottom:1.75rem}
.item::before{content:"";position:absolute;left:-2.07rem;top:.55rem;width:14px;height:14px;border-radius:50%;background:var(--sky);border:3px solid var(--bg)}
.item h3{font-size:1.2rem}
.meta{color:var(--muted);font-size:.95rem;margin:.15rem 0 .4rem}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.tab{padding:.5rem 1rem;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--text);font:600 .95rem Figtree,sans-serif;cursor:pointer}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;padding:0;margin:0;list-style:none}
.chips li{background:var(--card);border:1px solid var(--line);padding:.55rem .95rem;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.25rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.4rem}
.card h3{font-size:1.15rem;margin-bottom:.5rem}
.card p{margin:.3rem 0 .9rem;color:var(--muted)}
.tag{display:inline-block;font-size:.82rem;font-weight:600;padding:.2rem .6rem;border-radius:6px;background:rgba(79,159,224,.18);margin:0 .35rem .35rem 0}
.badge{border-left:5px solid var(--sun)}
.contact-wrap{display:grid;grid-template-columns:1fr 1.3fr;gap:1.5rem;align-items:start}
.c-list{display:grid;gap:1rem}
.c-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.25rem}
.c-card h3{font-size:1rem;color:var(--muted);font-weight:500;margin-bottom:.25rem}
.c-card a,.c-card strong{font-weight:600;font-size:1.05rem;word-break:break-word}
.c-card button{margin-top:.5rem}
.field{display:block;margin-bottom:1rem}
.field span{display:block;font-weight:600;margin-bottom:.35rem}
.field input,.field textarea{width:100%;padding:.75rem .9rem;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--sky);outline:none}
.err{color:#c0392b;font-weight:600;margin:0 0 1rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8a7a}}
:root[data-theme="dark"] .err{color:#ff8a7a}
.note{color:var(--muted);font-size:.9rem;margin:.75rem 0 0}
@media (max-width:860px){.contact-wrap{grid-template-columns:1fr}}
.feat{display:grid;grid-template-columns:1.1fr 1fr;gap:1.5rem;align-items:center;margin-bottom:1.25rem;padding:1.25rem}
.shot{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fafafa;color:#333;font-size:.7rem}
.shot .bar2{display:flex;gap:5px;padding:7px 10px;background:#e9edf2}
.shot .bar2 i{width:8px;height:8px;border-radius:50%;background:#b9c3cf}
.shot .hd{background:linear-gradient(135deg,#E60000,#003DA5);color:#fff;text-align:center;padding:14px 8px;font:700 .85rem 'Bricolage Grotesque',sans-serif}
.shot .tb{display:flex;gap:6px;padding:8px 10px}
.shot .tb b{padding:3px 8px;border-radius:5px;background:#e9edf2;font-weight:600}
.shot .tb b:first-child{background:#E60000;color:#fff}
.shot .fl{padding:4px 12px 14px}
.shot .fl span{display:block;height:16px;border:1px solid #cfd6de;border-radius:4px;margin-bottom:7px;background:#fff}
.shot .fl em{display:block;height:34px;border:1px solid #cfd6de;border-radius:4px;margin-bottom:7px;background:#fff}
.shot .fl u{display:block;height:18px;border-radius:4px;background:#E60000;width:45%}
.feat h3{font-size:1.35rem}
.feat p{color:var(--muted);margin:.5rem 0 1rem}
@media (max-width:860px){.feat{grid-template-columns:1fr}}
.pimg{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:8px;display:block;margin-bottom:.9rem}
.feat .pimg{margin-bottom:0}
footer{margin-top:4rem;padding:2rem 0;color:var(--muted);border-top:1px solid var(--line);font-size:.92rem}
.theme{position:fixed;right:max(1rem,env(safe-area-inset-right,0px));top:calc(1rem + env(safe-area-inset-top,0px));z-index:5;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:.45rem .9rem;font:600 .9rem Figtree,sans-serif;cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;padding-top:4rem}
  .side-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 2rem}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

  "Transversales": ["Gestion du temps", "Capacité d’organisation", "Communication", "Leadership", "Logiciels de gestion de projet"]
};

const projects = [
  { t: "Page web personnelle", d: "Une page de présentation construite avec la structure HTML et la mise en forme CSS.", tags: ["HTML", "CSS", "JavaScript"], u: "https://claude.ai/artifact/TGAq8gANUiKeepY9Sq9W4q", i: IMG.perso },
  { t: "Formulaire interactif", d: "Un formulaire qui réagit aux actions de l’utilisateur grâce à la logique JavaScript.", tags: ["HTML", "CSS", "JavaScript"], u: "https://claude.ai/artifact/HBgxEjmqQDdGe64xzf677S", i: IMG.form },
  { t: "Mini site vitrine", d: "Projet académique : un petit site vitrine responsive réalisé dans le cadre de mes études.", tags: ["HTML", "CSS", "Projet académique"], u: "https://claude.ai/artifact/Jz8C2q4LEuQcHbfNiQUfkn", i: IMG.vitrine }
];

const langs = [["Anglais", 75], ["Français", 75], ["Arabe", 100]];

function Skills() {
  const keys = Object.keys(skills);
  const [k, setK] = useState(keys[0]);
  return (
    <>
      <div className="tabs" role="tablist" aria-label="Catégories de compétences">
        {keys.map(x => (
          <button key={x} role="tab" aria-selected={k === x} className="tab" onClick={() => setK(x)}>{x}</button>
        ))}
      </div>
      <ul className="chips">{skills[k].map(s => <li key={s}>{s}</li>)}</ul>
    </>
  );
}

function Contact() {
  const [f, setF] = useState({ nom: "", email: "", msg: "" });
  const [err, setErr] = useState("");
  const [copied, setCopied] = useState(false);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const copy = () => {
    try { navigator.clipboard.writeText(ME.email); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) { window.location.href = "mailto:" + ME.email; }
  };
  const send = () => {
    if (!f.nom.trim() || !f.msg.trim()) { setErr("Renseigne ton nom et ton message avant d’envoyer."); return; }
    if (!/^\S+@\S+\.\S+$/.test(f.email.trim())) { setErr("Entre une adresse email valide pour que je puisse te répondre."); return; }
    setErr("");
    const subject = encodeURIComponent("Contact depuis ton portfolio – " + f.nom.trim());
    const body = encodeURIComponent(f.msg.trim() + "\n\n— " + f.nom.trim() + " (" + f.email.trim() + ")");
    window.location.href = "mailto:" + ME.email + "?subject=" + subject + "&body=" + body;
  };
  return (
    <div className="contact-wrap">
      <div className="c-list">
        <div className="c-card">
          <h3>Email</h3>
          <a href={"mailto:" + ME.email}>{ME.email}</a>
          <div><button className="btn ghost" onClick={copy}>{copied ? "Email copié" : "Copier l’email"}</button></div>
        </div>
        <div className="c-card">
          <h3>Téléphone</h3>
          <a href={"tel:" + ME.phone.replace(/\s/g, "")}>{ME.phone}</a>
        </div>
        <div className="c-card">
          <h3>Lieu d’études</h3>
          <strong>ISET Gafsa, Tunisie</strong>
        </div>
      </div>
      <div className="card">
        <label className="field"><span>Ton nom</span><input value={f.nom} onChange={set("nom")} autoComplete="name" /></label>
        <label className="field"><span>Ton email</span><input type="email" value={f.email} onChange={set("email")} autoComplete="email" /></label>
        <label className="field"><span>Ton message</span><textarea value={f.msg} onChange={set("msg")} /></label>
        {err && <p className="err" role="alert">{err}</p>}
        <button className="btn" onClick={send}>Envoyer le message</button>
        <p className="note">Le message s’ouvre dans ton application mail, prêt à partir vers {ME.email}.</p>
      </div>
    </div>
  );
}

function App() {
  const [dark, setDark] = useState(window.matchMedia("(prefers-color-scheme: dark)").matches);
  const [copied, setCopied] = useState(false);
  const toggle = () => {
    const n = !dark; setDark(n);
    document.documentElement.setAttribute("data-theme", n ? "dark" : "light");
  };
  const copy = () => {
    try { navigator.clipboard.writeText(ME.email); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) { window.location.href = "mailto:" + ME.email; }
  };
  return (
    <>
      <button className="theme" onClick={toggle} aria-pressed={dark}>{dark ? "Mode clair" : "Mode sombre"}</button>
      <div className="layout">
        <aside>
          <div className="avatar">{ME.photo ? <img src={ME.photo} alt={"Portrait de " + ME.name} /> : "AE"}</div>
          <div className="side-grid">
            <div>
              <h2>Coordonnées</h2>
              <ul>
                <li>{ME.phone}</li>
                <li><a href={"mailto:" + ME.email}>{ME.email}</a></li>
                <li>ISET Gafsa</li>
              </ul>
            </div>
            <div>
              <h2>Langues</h2>
              <ul>{langs.map(([n, v]) => (
                <li key={n}>{n}<div className="bar"><i style={{ width: v + "%" }} /></div></li>
              ))}</ul>
            </div>
            <div>
              <h2>Centres d’intérêt</h2>
              <ul><li>Lecture</li><li>Développement</li><li>Gym</li><li>Travail en équipe</li></ul>
            </div>
          </div>
        </aside>

        <main>
          <header className="hero">
            <h1>{ME.name}</h1>
            <p className="role">{ME.role}</p>
            <p>Étudiante en licence de technologie d’informatique à l’ISET Gafsa. Je dirige un club de l’institut et j’aime transformer une idée en projet qui avance, du code jusqu’à l’équipe qui le porte.</p>
            <div className="cta">
              <a className="btn" href="#projets">Voir mes projets</a>
              <button className="btn ghost" onClick={copy}>{copied ? "Email copié" : "Copier mon email"}</button>
            </div>
          </header>

          <section id="formation">
            <h2>Formation</h2>
            <div className="tl">
              <div className="item">
                <h3>Licence en technologie d’informatique</h3>
                <p className="meta">Institut Supérieur des Études Technologiques de Gafsa · 2025–2028</p>
                <p>Cours de développement web, bases de l’algorithmique et outils numériques.</p>
              </div>
            </div>
          </section>

          <section id="experience">
            <h2>Expérience et engagement</h2>
            <div className="tl">
              <div className="item">
                <h3>Leader d’un club à l’ISET Gafsa</h3>
                <p className="meta">Vie associative</p>
                <p>J’anime le club, j’organise les activités et je coordonne les membres.</p>
              </div>
              <div className="item">
                <h3>Membre du club eTwinning</h3>
                <p className="meta">Collaboration européenne</p>
                <p>Travail en équipe sur des projets avec des partenaires de plusieurs pays.</p>
              </div>
              <div className="item">
                <h3>Conférences en ligne internationales</h3>
                <p className="meta">Échanges avec des participants du monde entier</p>
                <p>Participation à de nombreuses conférences en ligne, en échange avec des personnes de différents pays.</p>
              </div>
            </div>
            <div className="card badge" style={{ marginTop: "1rem" }}>
              <h3>Attestation en blockchain</h3>
              <p style={{ marginBottom: 0 }}>Formation certifiée sur les principes de la blockchain.</p>
            </div>
          </section>

          <section id="competences">
            <h2>Compétences</h2>
            <Skills />
          </section>

          <section id="projets">
            <h2>Projets</h2>
            <article className="card feat">
              <img className="pimg" src={IMG.tt} alt="Capture d’écran : Service client Tunisie Telecom" loading="lazy" />
              <div>
                <h3>Service client Tunisie Telecom</h3>
                <p>Un site de support client complet : formulaire de contact avec validation, pièce jointe, suivi des messages par statut et espace d’administration. Le projet inclut aussi un schéma de base de données MySQL et un script PHP de traitement avec protection anti-spam.</p>
                <div>{["HTML", "CSS", "JavaScript", "PHP", "MySQL"].map(t => <span className="tag" key={t}>{t}</span>)}</div>
                <div className="cta"><a className="btn" href="https://claude.ai/artifact/Sm9YVGySJJGYVxiCfKuYxg" target="_blank" rel="noopener">Ouvrir le projet</a></div>
              </div>
            </article>
            <div className="grid">
              {projects.map(p => (
                <article className="card" key={p.t}>
                  <img className="pimg" src={p.i} alt={"Capture d’écran : " + p.t} loading="lazy" />
                  <h3>{p.t}</h3>
                  <p>{p.d}</p>
                  <div>{p.tags.map(t => <span className="tag" key={t}>{t}</span>)}</div>
                  <div className="cta"><a className="btn" href={p.u} target="_blank" rel="noopener">Ouvrir le projet</a></div>
                </article>
              ))}
            </div>
          </section>

          <section id="objectif">
            <h2>Objectif professionnel</h2>
            <p style={{ maxWidth: "62ch", fontSize: "1.1rem" }}>Acquérir une première expérience professionnelle à temps partiel tout en poursuivant mes études en informatique.</p>
            <div className="cta">
              <a className="btn" href="#contact">Me contacter</a>
            </div>
          </section>

          <section id="contact">
            <h2>Me contacter</h2>
            <p style={{ maxWidth: "62ch", marginTop: 0 }}>Une opportunité de stage, un projet de club ou une collaboration ? Écris-moi, je réponds dès que possible.</p>
            <Contact />
          </section>

          <footer>© 2026 {ME.name}</footer>
        </main>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
